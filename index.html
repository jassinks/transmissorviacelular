<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Tags para Tela Cheia real no iPhone quando salvo na Tela de Início -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Câmera OBS">
    <title>Câmera Móvel - OBS</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden; user-select: none;
        }
        #preview-wrap {
            position: fixed; inset: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1; background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        #preview {
            width: 100%; height: 100%; object-fit: contain;
            transition: transform 0.15s ease-out;
        }

        /* Barra Superior */
        .topo {
            position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; right: 14px; z-index: 10;
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            transition: opacity 0.2s;
        }
        #badge-status {
            background: rgba(0, 0, 0, 0.78); padding: 8px 12px; border-radius: 999px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 7px;
        }
        .ponto { width: 9px; height: 9px; border-radius: 50%; background: #888; }
        .ponto.pronto { background: #2fff00; }
        .ponto.no-ar { background: #ff2a2a; }
        .topo-acoes { display: flex; gap: 6px; }

        /* Controles Inferiores */
        .controles {
            position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); left: 14px; right: 14px; z-index: 10;
            display: flex; flex-direction: column; gap: 8px; align-items: center;
            transition: opacity 0.2s;
        }
        .linha-botoes {
            display: flex; gap: 8px; width: 100%; max-width: 420px; justify-content: center;
        }
        button {
            border: none; border-radius: 12px; font-weight: 700; font-size: 13px;
            cursor: pointer; color: #fff; padding: 12px 14px;
            background: rgba(30, 30, 30, 0.88);
            transition: transform 0.1s, background 0.15s;
        }
        button:active { transform: scale(0.95); }
        #btn-transmitir {
            width: 100%; max-width: 420px; padding: 15px; font-size: 15px;
            background: #007a08; text-transform: uppercase; letter-spacing: 0.5px;
        }
        #btn-transmitir.ao-vivo { background: #c62828; }
        .btn-secundario { flex: 1; }
        .btn-ativo { background: #1565c0; }
        .btn-mutado { background: rgba(160, 28, 28, 0.9); }
        .btn-mini { padding: 8px 11px; font-size: 12px; border-radius: 999px; }

        /* Seletor de Resolução + Zoom */
        .barra-ferramentas {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            width: 100%; max-width: 420px;
        }
        .grupo-pill {
            display: flex; align-items: center; gap: 4px;
            background: rgba(0, 0, 0, 0.75); padding: 4px; border-radius: 999px;
        }
        .btn-res {
            padding: 7px 11px; border-radius: 999px; font-size: 12px;
            background: transparent; color: #bbb;
        }
        .btn-res.ativa { background: #1565c0; color: #fff; }
        .zoom-bar button {
            padding: 6px 14px; border-radius: 999px; font-size: 15px;
            background: rgba(255, 255, 255, 0.14);
        }
        #zoom-label {
            min-width: 40px; text-align: center; font-size: 12px; font-weight: 700;
        }

        /* Modo Tela Limpa */
        body.tela-limpa .controles,
        body.tela-limpa .topo-acoes { opacity: 0; pointer-events: none; }

        /* Modo Economia de Bateria (OLED Preto Absoluto) */
        #overlay-economia {
            position: fixed; inset: 0; z-index: 99; background: #000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 24px;
        }
        body.modo-economia #overlay-economia { display: flex; }
        body.modo-economia #preview { display: none; } /* Pausa renderização local para poupar GPU/bateria */
        body.modo-economia .topo,
        body.modo-economia .controles { display: none; }
        .eco-texto { color: rgba(255, 255, 255, 0.28); font-size: 13px; margin-top: 8px; }
        .eco-ponto { color: rgba(255, 50, 50, 0.55); font-size: 14px; font-weight: 700; }
    </style>
</head>
<body>

    <div id="preview-wrap">
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <div class="topo">
        <div id="badge-status">
            <span class="ponto" id="ponto"></span>
            <span id="texto-status">Pronto</span>
        </div>
        <div class="topo-acoes">
            <button id="btn-economia" class="btn-mini">🔋 Economia</button>
            <button id="btn-fullscreen" class="btn-mini">⛶ Tela Cheia</button>
            <button id="btn-limpar" class="btn-mini">Ocultar</button>
        </div>
    </div>

    <div class="controles">
        <div class="barra-ferramentas">
            <div class="grupo-pill" id="seletor-res">
                <button class="btn-res" data-res="720p">720p</button>
                <button class="btn-res ativa" data-res="1080p">1080p</button>
                <button class="btn-res" data-res="4k">4K</button>
            </div>
            <div class="grupo-pill zoom-bar">
                <button id="btn-zoom-menos">−</button>
                <span id="zoom-label">1.0x</span>
                <button id="btn-zoom-mais">+</button>
            </div>
        </div>

        <div class="linha-botoes">
            <button id="btn-audio" class="btn-secundario btn-mutado">🎤 Áudio: OFF</button>
            <button id="btn-camera" class="btn-secundario">🔄 Virar Câmera</button>
        </div>
        <button id="btn-transmitir">🎥 Iniciar Câmera</button>
    </div>

    <!-- Tela Preta OLED para Economizar Bateria -->
    <div id="overlay-economia">
        <div class="eco-ponto">● TRANSMITINDO EM ECONOMIA DE BATERIA</div>
        <div class="eco-texto">A tela não vai desligar. Toque em qualquer lugar para voltar.</div>
    </div>

    <script>
        const CHAVE_OBS = 'obs-otacilio-celular-master';

        const RESOLUCOES = {
            '720p':  { w: 1280, h: 720,  bitrate: 1800000 },
            '1080p': { w: 1920, h: 1080, bitrate: 3000000 },
            '4k':    { w: 3840, h: 2160, bitrate: 6000000 }
        };

        const preview = document.getElementById('preview');
        const previewWrap = document.getElementById('preview-wrap');
        const btnTransmitir = document.getElementById('btn-transmitir');
        const btnAudio = document.getElementById('btn-audio');
        const btnCamera = document.getElementById('btn-camera');
        const btnLimpar = document.getElementById('btn-limpar');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const btnEconomia = document.getElementById('btn-economia');
        const overlayEconomia = document.getElementById('overlay-economia');
        const btnZoomMenos = document.getElementById('btn-zoom-menos');
        const btnZoomMais = document.getElementById('btn-zoom-mais');
        const zoomLabel = document.getElementById('zoom-label');
        const textoStatus = document.getElementById('texto-status');
        const ponto = document.getElementById('ponto');
        const botoesRes = document.querySelectorAll('.btn-res');

        let peer = null;
        let peerAberto = false;
        let streamAtual = null;
        let chamadaAtiva = null;
        let conexaoDados = null;
        let wakeLock = null;
        let modoCamera = 'environment';
        let resolucaoAtual = '1080p';
        let audioAtivo = false;
        let zoomAtual = 1.0;
        let usandoZoomHardware = false;

        // Mantém a tela sempre acesa (Wake Lock reforçado)
        async function ativarWakeLock() {
            try {
                if ('wakeLock' in navigator && !wakeLock) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (e) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && streamAtual) {
                ativarWakeLock();
            }
        });
        document.addEventListener('touchstart', () => {
            if (streamAtual && !wakeLock) ativarWakeLock();
        }, { passive: true });

        function iniciarPeer() {
            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', () => {
                peerAberto = true;
                if (!chamadaAtiva) {
                    textoStatus.textContent = 'Pronto (' + resolucaoAtual + ')';
                    ponto.className = 'ponto pronto';
                }
                if (streamAtual && !chamadaAtiva) {
                    conectarAoOBS();
                }
            });

            peer.on('disconnected', () => {
                peerAberto = false;
                textoStatus.textContent = 'Reconectando...';
                ponto.className = 'ponto';
                peer.reconnect();
            });

            peer.on('error', (err) => {
                textoStatus.textContent = 'Erro: ' + err.type;
                ponto.className = 'ponto';
            });
        }

        async function capturarCamera(facing, resKey) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('Navegador sem acesso à câmera (use HTTPS no Safari).');
            }
            const cfg = RESOLUCOES[resKey] || RESOLUCOES['1080p'];
            const constraints = {
                video: {
                    facingMode: { ideal: facing },
                    width: { ideal: cfg.w },
                    height: { ideal: cfg.h },
                    frameRate: { ideal: 30, max: 30 }
                },
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            };

            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (e) {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facing },
                    audio: true
                });
            }

            const videoTrack = stream.getVideoTracks()[0];
            if (videoTrack) {
                if ('contentHint' in videoTrack) videoTrack.contentHint = 'motion';
                if (videoTrack.getCapabilities) {
                    const caps = videoTrack.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        try {
                            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                        } catch (e) {}
                    }
                }
            }
            return stream;
        }

        async function otimizarTransmissao(call, resKey) {
            try {
                const pc = call.peerConnection;
                if (!pc) return;
                const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                if (!sender) return;
                const params = sender.getParameters();
                if (!params.encodings) params.encodings = [{}];
                params.degradationPreference = 'maintain-framerate';
                params.encodings[0].maxBitrate = (RESOLUCOES[resKey] || RESOLUCOES['1080p']).bitrate;
                await sender.setParameters(params);
            } catch (e) {}
        }

        function conectarAoOBS() {
            if (!peerAberto || !streamAtual) return;

            conexaoDados = peer.connect(CHAVE_OBS);
            conexaoDados.on('open', () => {
                if (!usandoZoomHardware) {
                    conexaoDados.send({ type: 'zoom', value: zoomAtual });
                }
            });

            chamadaAtiva = peer.call(CHAVE_OBS, streamAtual);
            setTimeout(() => otimizarTransmissao(chamadaAtiva, resolucaoAtual), 1000);

            textoStatus.textContent = 'NO AR (' + resolucaoAtual + ')';
            ponto.className = 'ponto no-ar';
            btnTransmitir.textContent = '✖ Encerrar Câmera';
            btnTransmitir.classList.add('ao-vivo');
        }

        // Troca de câmera ou resolução ao vivo sem derrubar o OBS
        async function atualizarStreamVideo() {
            if (!streamAtual) return;
            try {
                const novoStream = await capturarCamera(modoCamera, resolucaoAtual);
                const novaTrack = novoStream.getVideoTracks()[0];

                if (chamadaAtiva && chamadaAtiva.peerConnection) {
                    const sender = chamadaAtiva.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) await sender.replaceTrack(novaTrack);
                    await otimizarTransmissao(chamadaAtiva, resolucaoAtual);
                }

                streamAtual.getVideoTracks().forEach(t => t.stop());
                streamAtual.removeTrack(streamAtual.getVideoTracks()[0]);
                streamAtual.addTrack(novaTrack);
                preview.srcObject = streamAtual;
                novoStream.getAudioTracks().forEach(t => t.stop());

                textoStatus.textContent = 'NO AR (' + resolucaoAtual + ')';
                aplicarZoom(1.0);
            } catch (e) {
                alert('Erro ao ajustar câmera: ' + e.message);
            }
        }

        // Seletor de Resolução (720p / 1080p / 4K)
        botoesRes.forEach(btn => {
            btn.onclick = async () => {
                const novaRes = btn.dataset.res;
                if (novaRes === resolucaoAtual) return;
                resolucaoAtual = novaRes;
                botoesRes.forEach(b => b.classList.remove('ativa'));
                btn.classList.add('ativa');

                if (streamAtual) {
                    textoStatus.textContent = 'Trocando para ' + resolucaoAtual + '...';
                    await atualizarStreamVideo();
                } else {
                    textoStatus.textContent = 'Pronto (' + resolucaoAtual + ')';
                }
            };
        });

        // Zoom
        async function aplicarZoom(novoZoom) {
            zoomAtual = Math.min(4.0, Math.max(1.0, Math.round(novoZoom * 10) / 10));
            zoomLabel.textContent = zoomAtual.toFixed(1) + 'x';

            usandoZoomHardware = false;
            if (streamAtual) {
                const track = streamAtual.getVideoTracks()[0];
                if (track && track.getCapabilities) {
                    const caps = track.getCapabilities();
                    if (caps.zoom) {
                        const z = Math.min(caps.zoom.max, Math.max(caps.zoom.min, zoomAtual));
                        try {
                            await track.applyConstraints({ advanced: [{ zoom: z }] });
                            usandoZoomHardware = true;
                            preview.style.transform = 'scale(1)';
                            if (conexaoDados && conexaoDados.open) {
                                conexaoDados.send({ type: 'zoom', value: 1 });
                            }
                            return;
                        } catch (e) {}
                    }
                }
            }

            preview.style.transform = `scale(${zoomAtual})`;
            if (conexaoDados && conexaoDados.open) {
                conexaoDados.send({ type: 'zoom', value: zoomAtual });
            }
        }

        btnZoomMais.onclick = () => aplicarZoom(zoomAtual + 0.5);
        btnZoomMenos.onclick = () => aplicarZoom(zoomAtual - 0.5);

        // Áudio
        function aplicarEstadoAudio() {
            if (streamAtual) {
                streamAtual.getAudioTracks().forEach(t => { t.enabled = audioAtivo; });
            }
            btnAudio.textContent = audioAtivo ? '🎤 Áudio: ON' : '🎤 Áudio: OFF';
            btnAudio.className = audioAtivo ? 'btn-secundario btn-ativo' : 'btn-secundario btn-mutado';
        }

        btnAudio.onclick = () => {
            audioAtivo = !audioAtivo;
            aplicarEstadoAudio();
        };

        // Virar Câmera
        btnCamera.onclick = async () => {
            modoCamera = (modoCamera === 'environment') ? 'user' : 'environment';
            await atualizarStreamVideo();
        };

        // Iniciar / Encerrar
        btnTransmitir.onclick = async () => {
            if (streamAtual) {
                if (chamadaAtiva) chamadaAtiva.close();
                if (conexaoDados) conexaoDados.close();
                streamAtual.getTracks().forEach(t => t.stop());
                if (wakeLock) wakeLock.release();
                window.location.reload();
                return;
            }

            try {
                textoStatus.textContent = 'Abrindo câmera...';
                streamAtual = await capturarCamera(modoCamera, resolucaoAtual);
                aplicarEstadoAudio();
                preview.srcObject = streamAtual;
                await preview.play().catch(() => {});
                await ativarWakeLock();

                if (peerAberto) {
                    conectarAoOBS();
                } else {
                    textoStatus.textContent = 'Câmera OK, aguardando OBS...';
                }
            } catch (err) {
                textoStatus.textContent = 'Erro na câmera';
                alert('Não foi possível abrir a câmera: ' + err.message);
            }
        };

        // Tela Cheia
        btnFullscreen.onclick = () => {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                } else {
                    // Fallback para iPhone Safari em aba comum
                    document.body.classList.add('tela-limpa');
                }
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        };

        // Modo Economia de Bateria (OLED)
        btnEconomia.onclick = (e) => {
            e.stopPropagation();
            document.body.classList.add('modo-economia');
        };
        overlayEconomia.onclick = () => {
            document.body.classList.remove('modo-economia');
        };

        // Ocultar controles (Tela Limpa)
        btnLimpar.onclick = (e) => {
            e.stopPropagation();
            document.body.classList.add('tela-limpa');
        };
        previewWrap.onclick = () => {
            if (document.body.classList.contains('tela-limpa')) {
                document.body.classList.remove('tela-limpa');
            }
        };

        iniciarPeer();
    </script>
</body>
</html>
