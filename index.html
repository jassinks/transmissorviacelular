<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera Móvel - OBS</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden; user-select: none;
        }
        #preview-wrap {
            position: fixed; inset: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1; background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        #preview {
            width: 100%; height: 100%; object-fit: contain;
            transition: transform 0.15s ease-out;
        }
        .topo {
            position: fixed; top: 14px; left: 14px; right: 14px; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            transition: opacity 0.25s;
        }
        #badge-status {
            background: rgba(0, 0, 0, 0.72); padding: 8px 14px; border-radius: 999px;
            font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(6px);
        }
        .ponto { width: 10px; height: 10px; border-radius: 50%; background: #888; }
        .ponto.pronto { background: #2fff00; }
        .ponto.no-ar { background: #ff2a2a; animation: piscar 1.2s infinite; }
        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

        .controles {
            position: fixed; bottom: 20px; left: 14px; right: 14px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px; align-items: center;
            transition: opacity 0.25s;
        }
        .linha-botoes {
            display: flex; gap: 8px; width: 100%; max-width: 420px; justify-content: center;
        }
        button {
            border: none; border-radius: 12px; font-weight: 700; font-size: 14px;
            cursor: pointer; color: #fff; padding: 13px 16px;
            background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(6px);
            transition: transform 0.1s, background 0.2s;
        }
        button:active { transform: scale(0.95); }
        #btn-transmitir {
            width: 100%; max-width: 420px; padding: 16px; font-size: 16px;
            background: #007a08; text-transform: uppercase; letter-spacing: 0.5px;
        }
        #btn-transmitir.ao-vivo { background: #c62828; }
        .btn-secundario { flex: 1; }
        .btn-ativo { background: #1565c0; }
        .btn-mutado { background: rgba(180, 30, 30, 0.85); }
        .btn-mini { padding: 8px 12px; font-size: 12px; border-radius: 999px; }

        .zoom-bar {
            display: flex; align-items: center; gap: 8px;
            background: rgba(0, 0, 0, 0.65); padding: 6px 10px; border-radius: 999px;
            backdrop-filter: blur(6px);
        }
        .zoom-bar button {
            padding: 8px 16px; border-radius: 999px; font-size: 16px;
            background: rgba(255, 255, 255, 0.15);
        }
        #zoom-label {
            min-width: 48px; text-align: center; font-size: 13px; font-weight: 700;
        }

        body.tela-limpa .controles,
        body.tela-limpa #btn-limpar { opacity: 0; pointer-events: none; }
        #aviso-toque {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            z-index: 5; font-size: 11px; color: rgba(255,255,255,0.45);
            display: none; pointer-events: none;
        }
        body.tela-limpa #aviso-toque { display: block; }
    </style>
</head>
<body>

    <div id="preview-wrap">
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <div class="topo">
        <div id="badge-status">
            <span class="ponto" id="ponto"></span>
            <span id="texto-status">Pronto para iniciar</span>
        </div>
        <button id="btn-limpar" class="btn-mini">Tela Limpa</button>
    </div>

    <div class="controles">
        <div class="zoom-bar">
            <button id="btn-zoom-menos">−</button>
            <span id="zoom-label">1.0x</span>
            <button id="btn-zoom-mais">+</button>
        </div>
        <div class="linha-botoes">
            <button id="btn-audio" class="btn-secundario btn-mutado">🎤 Áudio: OFF</button>
            <button id="btn-camera" class="btn-secundario">🔄 Virar Câmera</button>
        </div>
        <button id="btn-transmitir">🎥 Iniciar Câmera 1080p</button>
    </div>

    <div id="aviso-toque">Toque na tela para mostrar os controles</div>

    <script>
        const CHAVE_OBS = 'obs-otacilio-celular-master';

        const preview = document.getElementById('preview');
        const previewWrap = document.getElementById('preview-wrap');
        const btnTransmitir = document.getElementById('btn-transmitir');
        const btnAudio = document.getElementById('btn-audio');
        const btnCamera = document.getElementById('btn-camera');
        const btnLimpar = document.getElementById('btn-limpar');
        const btnZoomMenos = document.getElementById('btn-zoom-menos');
        const btnZoomMais = document.getElementById('btn-zoom-mais');
        const zoomLabel = document.getElementById('zoom-label');
        const textoStatus = document.getElementById('texto-status');
        const ponto = document.getElementById('ponto');

        let peer = null;
        let peerAberto = false;
        let streamAtual = null;
        let chamadaAtiva = null;
        let conexaoDados = null;
        let wakeLock = null;
        let modoCamera = 'environment';
        let audioAtivo = false;
        let zoomAtual = 1.0;
        let usandoZoomHardware = false;

        function iniciarPeer() {
            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', () => {
                peerAberto = true;
                if (!chamadaAtiva) {
                    textoStatus.textContent = 'Servidor conectado';
                    ponto.className = 'ponto pronto';
                }
                if (streamAtual && !chamadaAtiva) {
                    conectarAoOBS();
                }
            });

            peer.on('disconnected', () => {
                peerAberto = false;
                textoStatus.textContent = 'Reconectando...';
                ponto.className = 'ponto';
                peer.reconnect();
            });

            peer.on('error', (err) => {
                textoStatus.textContent = 'Erro: ' + err.type;
                ponto.className = 'ponto';
            });
        }

        async function ativarWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && chamadaAtiva) {
                ativarWakeLock();
            }
        });

        // Captura flexível (não trava orientação ao girar o iPhone)
        async function capturarCamera(facing) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('Navegador sem acesso à câmera (use HTTPS no Safari).');
            }
            const constraintsAlta = {
                video: {
                    facingMode: { ideal: facing },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    frameRate: { ideal: 30, max: 30 }
                },
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            };
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia(constraintsAlta);
            } catch (e) {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facing },
                    audio: true
                });
            }

            // Prioriza fluidez de movimento e reforça foco automático contínuo
            const videoTrack = stream.getVideoTracks()[0];
            if (videoTrack) {
                if ('contentHint' in videoTrack) videoTrack.contentHint = 'motion';
                if (videoTrack.getCapabilities) {
                    const caps = videoTrack.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        try {
                            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                        } catch (e) {}
                    }
                }
            }
            return stream;
        }

        // Otimiza bitrate para 3 Mbps priorizando fluidez sem travadas
        async function otimizarTransmissao(call) {
            try {
                const pc = call.peerConnection;
                if (!pc) return;
                const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                if (!sender) return;
                const params = sender.getParameters();
                if (!params.encodings) params.encodings = [{}];
                params.degradationPreference = 'maintain-framerate';
                params.encodings[0].maxBitrate = 3000000; // 3 Mbps estável no Wi-Fi
                await sender.setParameters(params);
            } catch (e) {}
        }

        function conectarAoOBS() {
            if (!peerAberto || !streamAtual) return;

            conexaoDados = peer.connect(CHAVE_OBS);
            conexaoDados.on('open', () => {
                if (!usandoZoomHardware) {
                    conexaoDados.send({ type: 'zoom', value: zoomAtual });
                }
            });

            chamadaAtiva = peer.call(CHAVE_OBS, streamAtual);
            setTimeout(() => otimizarTransmissao(chamadaAtiva), 1000);

            textoStatus.textContent = 'NO AR (OBS)';
            ponto.className = 'ponto no-ar';
            btnTransmitir.textContent = '✖ Encerrar Câmera';
            btnTransmitir.classList.add('ao-vivo');
        }

        async function aplicarZoom(novoZoom) {
            zoomAtual = Math.min(4.0, Math.max(1.0, Math.round(novoZoom * 10) / 10));
            zoomLabel.textContent = zoomAtual.toFixed(1) + 'x';

            usandoZoomHardware = false;
            if (streamAtual) {
                const track = streamAtual.getVideoTracks()[0];
                if (track && track.getCapabilities) {
                    const caps = track.getCapabilities();
                    if (caps.zoom) {
                        const z = Math.min(caps.zoom.max, Math.max(caps.zoom.min, zoomAtual));
                        try {
                            await track.applyConstraints({ advanced: [{ zoom: z }] });
                            usandoZoomHardware = true;
                            preview.style.transform = 'scale(1)';
                            if (conexaoDados && conexaoDados.open) {
                                conexaoDados.send({ type: 'zoom', value: 1 });
                            }
                            return;
                        } catch (e) {}
                    }
                }
            }

            preview.style.transform = `scale(${zoomAtual})`;
            if (conexaoDados && conexaoDados.open) {
                conexaoDados.send({ type: 'zoom', value: zoomAtual });
            }
        }

        btnZoomMais.onclick = () => aplicarZoom(zoomAtual + 0.5);
        btnZoomMenos.onclick = () => aplicarZoom(zoomAtual - 0.5);

        function aplicarEstadoAudio() {
            if (streamAtual) {
                streamAtual.getAudioTracks().forEach(t => { t.enabled = audioAtivo; });
            }
            btnAudio.textContent = audioAtivo ? '🎤 Áudio: ON' : '🎤 Áudio: OFF';
            btnAudio.className = audioAtivo ? 'btn-secundario btn-ativo' : 'btn-secundario btn-mutado';
        }

        btnAudio.onclick = () => {
            audioAtivo = !audioAtivo;
            aplicarEstadoAudio();
        };

        btnCamera.onclick = async () => {
            modoCamera = (modoCamera === 'environment') ? 'user' : 'environment';
            if (!streamAtual) return;

            try {
                const novoStream = await capturarCamera(modoCamera);
                const novaTrack = novoStream.getVideoTracks()[0];

                if (chamadaAtiva && chamadaAtiva.peerConnection) {
                    const sender = chamadaAtiva.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) await sender.replaceTrack(novaTrack);
                }

                streamAtual.getVideoTracks().forEach(t => t.stop());
                streamAtual.removeTrack(streamAtual.getVideoTracks()[0]);
                streamAtual.addTrack(novaTrack);
                preview.srcObject = streamAtual;
                novoStream.getAudioTracks().forEach(t => t.stop());

                aplicarZoom(1.0);
            } catch (e) {
                alert('Erro ao trocar câmera: ' + e.message);
            }
        };

        btnTransmitir.onclick = async () => {
            if (streamAtual) {
                if (chamadaAtiva) chamadaAtiva.close();
                if (conexaoDados) conexaoDados.close();
                streamAtual.getTracks().forEach(t => t.stop());
                if (wakeLock) wakeLock.release();
                window.location.reload();
                return;
            }

            try {
                textoStatus.textContent = 'Abrindo câmera...';
                streamAtual = await capturarCamera(modoCamera);
                aplicarEstadoAudio();
                preview.srcObject = streamAtual;
                await preview.play().catch(() => {});
                await ativarWakeLock();

                if (peerAberto) {
                    conectarAoOBS();
                } else {
                    textoStatus.textContent = 'Câmera OK, aguardando OBS...';
                }
            } catch (err) {
                textoStatus.textContent = 'Erro na câmera';
                alert('Não foi possível abrir a câmera: ' + err.message);
            }
        };

        btnLimpar.onclick = (e) => {
            e.stopPropagation();
            document.body.classList.add('tela-limpa');
        };
        previewWrap.onclick = () => {
            if (document.body.classList.contains('tela-limpa')) {
                document.body.classList.remove('tela-limpa');
            }
        };

        iniciarPeer();
    </script>
</body>
</html>
